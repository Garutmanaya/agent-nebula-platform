[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-nebula-platform"
version = "1.1.1"
description = "Pluggable secure-agent platform for Agent Nebula-compatible agents."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "pydantic>=2.11.3,<3.0.0",
  "fastapi==0.143.0",
  "agent-nebula-sdk>=5.0.0,<6.0.0",
  "a2a-sdk[http-server]>=1.1.2,<1.2.0",
  "a2a-sdk[grpc]>=1.1.2,<1.2.0",
  "grpcio>=1.70.0,<2.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio==1.4.0",
  "ruff>=0.11.0,<1",
]

# Source package for the Agent Nebula Platform repository.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
